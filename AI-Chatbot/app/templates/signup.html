<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - AI Chat Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(-45deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .glass-effect {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        .glass-effect:hover {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
            border-color: rgba(255, 255, 255, 0.4);
        }
        
        .btn-glow:hover {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transform: translateY(-2px);
        }
        
        .floating-card {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="gradient-bg min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-gradient-to-r from-purple-500 via-pink-500 to-red-500 rounded-2xl flex items-center justify-center mx-auto mb-6 floating-card">
                <i data-lucide="message-circle" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-4xl font-bold text-white mb-3">Create Account</h1>
            <p class="text-white/80 text-lg">Join our AI Chat community</p>
        </div>

        <!-- Signup Form -->
        <div class="glass-effect rounded-2xl p-10">
            <form id="signupForm" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium text-white mb-3">Email Address</label>
                    <input type="email" id="email" name="email" required 
                           class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-purple-400/50 input-focus transition-all duration-300">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-white mb-3">Password</label>
                    <input type="password" id="password" name="password" required 
                           class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-purple-400/50 input-focus transition-all duration-300">
                </div>

                <div>
                    <label for="fullName" class="block text-sm font-medium text-white mb-3">Full Name</label>
                    <input type="text" id="fullName" name="fullName" 
                           class="w-full px-5 py-4 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/60 focus:outline-none focus:ring-2 focus:ring-purple-400/50 input-focus transition-all duration-300">
                </div>

                <button type="submit" 
                        class="w-full bg-gradient-to-r from-white to-purple-100 text-purple-600 font-bold py-4 rounded-xl hover:from-purple-100 hover:to-white transition-all duration-300 btn-glow text-lg">
                    Create Account →
                </button>
            </form>

            <div class="mt-8 text-center">
                <p class="text-white/80 text-base">
                    Already have an account? 
                    <a href="/login" class="text-white font-bold hover:text-purple-200 transition-colors duration-300">Sign in here</a>
                </p>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div id="message" class="hidden mt-4 p-4 rounded-lg text-center">
            <p id="messageText"></p>
        </div>
    </div>

    <script>
        lucide.createIcons();

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value;
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        full_name: fullName
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('Account created successfully! Redirecting to login...', 'bg-green-500/20 border-green-500/50');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    const errorMessage = data.detail || 'Registration failed';
                    showMessage(errorMessage, 'bg-red-500/20 border-red-500/50');
                }
            } catch (error) {
                showMessage('Network error. Please try again.', 'bg-red-500/20 border-red-500/50');
            }
        });

        function showMessage(message, classes) {
            const messageDiv = document.getElementById('message');
            const messageText = document.getElementById('messageText');
            messageText.textContent = message;
            messageDiv.className = `mt-4 p-4 rounded-lg text-center text-white border ${classes}`;
            messageDiv.classList.remove('hidden');
            
            setTimeout(() => {
                messageDiv.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
