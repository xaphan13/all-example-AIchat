[project]
name = "openrouter-chat-example"
version = "0.1.0"
description = "Минимальный пример чата с OpenAI-совместимым агрегатором (OpenRouter и аналоги)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Вторая реализация клиента — официальный SDK OpenAI.
openai = ["openai>=1.40"]

[tool.uv]
package = false
